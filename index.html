function App() {
  const [view, setView] = useState("home");
  const [users, setUsers] = useState([]);
  const [results, setResults] = useState({});
  const [adminMode, setAdminMode] = useState(false);
  const [loading, setLoading] = useState(true);

  const fetchData = useCallback(async () => {
    try {
      const [{ data:uData },{ data:rData }] = await Promise.all([
        sb.from("users").select("*"),
        sb.from("results").select("*"),
      ]);
      if (uData) setUsers(uData);
      if (rData) { const rMap={}; rData.forEach(r=>rMap[r.fixture_id]=r.result); setResults(rMap); }
    } catch(e) { console.error(e); }
    setLoading(false);
  }, []);

  useEffect(() => { fetchData(); }, [fetchData]);

  useEffect(() => {
    const uSub = sb.channel("users-changes").on("postgres_changes",{event:"*",schema:"public",table:"users"},fetchData).subscribe();
    const rSub = sb.channel("results-changes").on("postgres_changes",{event:"*",schema:"public",table:"results"},fetchData).subscribe();
    return () => { sb.removeChannel(uSub); sb.removeChannel(rSub); };
  }, [fetchData]);

  const saveUser = async (userData) => { await sb.from("users").upsert(userData,{onConflict:"email"}); await fetchData(); };
  const saveResult = async (fixtureId,result) => { await sb.from("results").upsert({fixture_id:fixtureId,result,updated_at:new Date().toISOString()},{onConflict:"fixture_id"}); await fetchData(); };
  const deleteUser = async (email) => { await sb.from("users").delete().eq("email",email); await fetchData(); };

  const scoreUser = (preds) => {
    let pts=0,correct=0;
    for (const [fid,pred] of Object.entries(preds||{}))
      if (results[fid]&&results[fid]===pred) { pts+=3; correct++; }
    return {pts,correct};
  };

  const leaderboard = users
    .map(u=>({...u,predictions:u.predictions||{},...scoreUser(u.predictions)}))
    .sort((a,b)=>b.pts-a.pts||b.correct-a.correct);

  if (loading) return (
    <>
      <style>{css}</style>
      <div className="app">
        <div className="header"><div className="header-top">
          <div className="school-name">Mulberry School for Girls</div>
          <div className="app-title">World Cup 2026 Predictor ⚽</div>
        </div><div className="header-accent"/></div>
        <div className="spinner"><div className="spin"/></div>
      </div>
    </>
  );

  return (
    <>
      <style>{css}</style>
      <div className="app">
        <div className="header">
          <div className="header-top">
            <div className="school-name">Mulberry School for Girls</div>
            <div className="app-title">World Cup 2026 Predictor ⚽</div>
            <div className="app-sub">Staff competition — group stage predictions</div>
            <div className="nav">
              {[["home","🏠 Home"],["fixtures","📅 Fixtures"],["leaderboard","🏆 Leaderboard"],["admin","🔧 Admin"]].map(([v,label])=>(
                <button key={v} className={`nav-btn${view===v?" active":""}`} onClick={()=>setView(v)}>{label}</button>
              ))}
            </div>
          </div>
          <div className="header-accent"/>
        </div>
        <div className="content">
          {view==="home" && <HomeView setView={setView} leaderboard={leaderboard} results={results}/>}
          {view==="fixtures" && <FixturesView results={results} leaderboard={leaderboard} saveResult={saveResult}/>}
          {view==="leaderboard" && <LeaderboardView leaderboard={leaderboard} results={results}/>}
          {view==="admin" && <AdminView results={results} saveResult={saveResult} adminMode={adminMode} setAdminMode={setAdminMode} users={users} saveUser={saveUser} deleteUser={deleteUser}/>}
          <div style={{textAlign:"center",fontSize:11,color:"#c0b8d4",marginTop:"2rem",paddingBottom:"0.5rem"}}>v66</div>
        </div>
      </div>
    </>
  );
}

    "#f7a800","#82bc00","#2e0252","#ec008c","#005cb9","#00a09b","#5e60ab",
    "#78b2d8","#fbed1d","#c1d956","#252a78","#40ac48","#31c5f4","#e2231a",
    "#662f8f","#6c6a15","#fde66b","#32647e","#4e9d2d","#f36d21","#5c3896",
    "#42b4e5","#e70095","#b3282d","#178ea6","#f7a800","#82bc00","#2e0252",
    "#ec008c","#005cb9","#00a09b","#5e60ab","#78b2d8","#fbed1d","#c1d956",
    "#252a78","#40ac48","#31c5f4","#e2231a","#662f8f",
  ];

  const playedFixtures = FIXTURES.filter(f=>results[f.id]);
  const allUsers = leaderboard;

  const series = allUsers.map((u,i) => {
    let pts = 0;
    const points = [0];
    playedFixtures.forEach(f => {
      if (u.predictions[f.id] && results[f.id] === u.predictions[f.id]) pts += 3;
      points.push(pts);
    });
    return { name: u.name, points, color: COLORS[i % COLORS.length] };
  });

  const maxPts = Math.max(...series.map(s=>s.points[s.points.length-1]), 3);
  const matchCount = playedFixtures.length;

  const W = 600, H = 300, PL = 36, PR = 12, PT = 12, PB = 28;
  const chartW = W-PL-PR, chartH = H-PT-PB;

  const xPos = i => PL + (matchCount===0 ? 0 : (i/matchCount)*chartW);
  const yPos = v => PT + chartH - (v/maxPts)*chartH;

  const step = maxPts <= 9 ? 3 : maxPts <= 18 ? 6 : maxPts <= 30 ? 9 : 12;
  const yTicks = [];
  for (let v=0; v<=maxPts; v+=step) yTicks.push(v);

  const xStep = matchCount <= 12 ? 2 : matchCount <= 24 ? 4 : 6;
  const xTicks = [];
  for (let i=0; i<=matchCount; i+=xStep) xTicks.push(i);

  return (
    <div style={{overflowX:"auto"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",minWidth:320,fontFamily:"Nunito,sans-serif"}}>
        {yTicks.map(v=>(
          <g key={v}>
            <line x1={PL} y1={yPos(v)} x2={W-PR} y2={yPos(v)} stroke="#f0eaf8" strokeWidth="1"/>
            <text x={PL-4} y={yPos(v)+4} textAnchor="end" fontSize="9" fill="#aaa">{v}</text>
          </g>
        ))}
        {xTicks.map(i=>(
          <text key={i} x={xPos(i)} y={H-8} textAnchor="middle" fontSize="9" fill="#aaa">{i}</text>
        ))}
        <text x={PL-28} y={PT+chartH/2} textAnchor="middle" fontSize="9" fill="#888" transform={`rotate(-90,${PL-28},${PT+chartH/2})`}>Points</text>
        <text x={PL+chartW/2} y={H-1} textAnchor="middle" fontSize="9" fill="#888">Matches played</text>
        {series.map(s=>{
          const d = s.points.map((v,i)=>`${i===0?"M":"L"}${xPos(i)},${yPos(v)}`).join(" ");
          return <path key={s.name} d={d} fill="none" stroke={s.color} strokeWidth="1.5" strokeOpacity="0.7" strokeLinejoin="round" strokeLinecap="round"/>;
        })}
        {series.map(s=>{
          const last = s.points[s.points.length-1];
          return <circle key={s.name} cx={xPos(s.points.length-1)} cy={yPos(last)} r="2.5" fill={s.color} fillOpacity="0.9"/>;
        })}
      </svg>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:8}}>
        {series.map((u,i)=>(
          <div key={u.name} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,fontWeight:600,color:"#555"}}>
            <div style={{width:12,height:3,borderRadius:2,background:u.color,flexShrink:0}}/>
            <span>{u.name}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── FIXTURES ─────────────────────────────────────────────────────────────────
function FixturesView({ results, leaderboard, saveResult }) {
  const [expandedFixture, setExpandedFixture] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState("");
  const [selectedDate, setSelectedDate] = useState(null);

  const handleSync = async () => {
    setSyncing(true); setSyncMsg("");
    try {
      const res = await fetch(FUNCTION_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_KEY}`},
        body:JSON.stringify({action:"sync_results"}),
      });
      if (!res.ok) { setSyncMsg("❌ API error — please try again later."); setSyncing(false); return; }
      const data = await res.json();
      const matches = data.matches||[];
      let updated = 0;
      for (const match of matches) {
        const home=normalise(match.homeTeam?.name), away=normalise(match.awayTeam?.name);
        const homeGoals=match.score?.fullTime?.home, awayGoals=match.score?.fullTime?.away;
        if (!home||!away||homeGoals===null||awayGoals===null) continue;
        const fixture = FIXTURES.find(f=>f.home===home&&f.away===away);
        if (!fixture) continue;
        const result = homeGoals>awayGoals?"H":awayGoals>homeGoals?"A":"D";
        await saveResult(fixture.id, result);
        updated++;
      }
      setSyncMsg(`✅ ${updated} result${updated!==1?"s":""} synced.`);
    } catch(e) { setSyncMsg("❌ Network error. Please try again."); }
    setSyncing(false);
  };

  const byDate={};
  FIXTURES.forEach(f=>{if(!byDate[f.date])byDate[f.date]=[];byDate[f.date].push(f);});
  const dates = Object.keys(byDate).sort();

  const formatDate = s => new Date(s+"T12:00:00Z").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const formatShort = s => {
    const d = new Date(s+"T12:00:00Z");
    return { day: d.toLocaleDateString("en-GB",{weekday:"short"}), date: d.getDate(), month: d.toLocaleDateString("en-GB",{month:"short"}) };
  };

  const getPredStats = fid => {
    let h=0,d=0,a=0; const hUsers=[],dUsers=[],aUsers=[];
    leaderboard.forEach(u=>{
      const p=(u.predictions||{})[fid];
      if(p==="H"){h++;hUsers.push(u.name);}
      else if(p==="D"){d++;dUsers.push(u.name);}
      else if(p==="A"){a++;aUsers.push(u.name);}
    });
    return {h,d,a,total:h+d+a,hUsers,dUsers,aUsers};
  };

  const scrollToDate = (date) => {
    setSelectedDate(date);
    setTimeout(() => {
      const el = document.getElementById(`date-${date}`);
      if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
    }, 50);
  };

  const hasResult = date => byDate[date]?.some(f => results[f.id]);

  return (
    <div>
      <div className="card" style={{marginBottom:12}}>
        <div className="section-title" style={{marginBottom:8}}>📅 Group Stage Fixtures</div>
        <p style={{fontSize:13,color:"#666",marginBottom:12}}>All times in BST. Tap a fixture to see who predicted what.</p>
        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:14,flexWrap:"wrap"}}>
          <button className="btn btn-green" style={{fontSize:13,padding:"8px 16px"}} onClick={handleSync} disabled={syncing}>{syncing?"⏳ Syncing...":"🔄 Sync Results"}</button>
          {syncMsg&&<span style={{fontSize:12,color:syncMsg.startsWith("✅")?"#4e9d2d":"#c0392b",fontWeight:600}}>{syncMsg}</span>}
        </div>

        {/* Calendar strip */}
        <div style={{overflowX:"auto",paddingBottom:4}}>
          <div style={{display:"flex",gap:6,minWidth:"max-content"}}>
            {dates.map(date=>{
              const {day,date:d,month} = formatShort(date);
              const active = selectedDate===date;
              const done = hasResult(date);
              return (
                <button key={date} onClick={()=>scrollToDate(date)} style={{
                  display:"flex",flexDirection:"column",alignItems:"center",
                  padding:"6px 10px",borderRadius:10,border:`1.5px solid ${active?"#5c3896":done?"#4e9d2d":"#d4c8e8"}`,
                  background:active?"#5c3896":done?"#e8f5e2":"#fff",
                  color:active?"#fff":done?"#2a6b15":"#555",
                  cursor:"pointer",fontFamily:"inherit",minWidth:46,
                }}>
                  <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",opacity:.8}}>{day}</span>
                  <span style={{fontSize:18,fontWeight:800,lineHeight:1.2}}>{d}</span>
                  <span style={{fontSize:10,fontWeight:600,opacity:.8}}>{month}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>

      {dates.map(date=>{
        const dayF=byDate[date];
        if(!dayF.length) return null;
        return (
          <div key={date} id={`date-${date}`}>
            <div className="date-header">📆 {formatDate(date)}</div>
            {dayF.map(f=>{
              const res=results[f.id], stats=getPredStats(f.id), isExpanded=expandedFixture===f.id;
              return (
                <div key={f.id} className="fix-card" style={{cursor:"pointer"}} onClick={()=>setExpandedFixture(isExpanded?null:f.id)}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                    <div style={{fontSize:14,fontWeight:700,flex:1}}>{FLAGS[f.home]||"🏳"} {f.home}</div>
                    <div style={{fontSize:11,color:"#bbb",fontWeight:700}}>vs</div>
                    <div style={{fontSize:14,fontWeight:700,flex:1,textAlign:"right"}}>{f.away} {FLAGS[f.away]||"🏳"}</div>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <span style={{fontSize:10,fontWeight:800,background:"#ede8f8",color:"#5c3896",borderRadius:10,padding:"2px 8px"}}>Group {f.group}</span>
                      <span style={{fontSize:11,color:"#aaa",fontWeight:600}}>🕐 {f.time} BST</span>
                    </div>
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      {res?<span className="badge badge-green">{res==="H"?`${f.home} win`:res==="D"?"Draw":`${f.away} win`}</span>:<span className="badge badge-gray">No result yet</span>}
                      <span style={{fontSize:14,color:"#d4c8e8"}}>{isExpanded?"▲":"▼"}</span>
                    </div>
                  </div>
                  {stats.total>0&&(
                    <div style={{marginTop:10,borderTop:"1px solid #f5f0fc",paddingTop:8}}>
                      <div style={{fontSize:11,fontWeight:700,color:"#6d6e71",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.4px"}}>
                        Predictions — {stats.total} staff
                        {res&&<span style={{marginLeft:8,color:"#4e9d2d"}}>· {res==="H"?stats.h:res==="D"?stats.d:stats.a} correct ({Math.round(((res==="H"?stats.h:res==="D"?stats.d:stats.a)/stats.total)*100)}%)</span>}
                      </div>
                      {[["H",f.home,stats.h,stats.hUsers,"#5c3896"],["D","Draw",stats.d,stats.dUsers,"#f36d21"],["A",f.away,stats.a,stats.aUsers,"#42b4e5"]].map(([code,label,count,names,color])=>{
                        const pct=stats.total>0?Math.round((count/stats.total)*100):0, correct=res&&res===code;
                        return (
                          <div key={code} style={{marginBottom:isExpanded?8:3}}>
                            <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#666"}}>
                              <span style={{minWidth:100,fontWeight:correct?700:400,color:correct?"#4e9d2d":"#666"}}>{label}{correct?" ✅":""}</span>
                              <div className="bar-bg"><div className="bar-fill" style={{width:`${pct}%`,background:correct?"#4e9d2d":color,opacity:correct?1:0.5}}/></div>
                              <span style={{minWidth:36,textAlign:"right",fontWeight:600,color:correct?"#4e9d2d":"#888"}}>{pct}%</span>
                            </div>
                            {isExpanded&&names.length>0&&(
                              <div style={{marginTop:4,marginLeft:106,display:"flex",flexWrap:"wrap",gap:4}}>
                                {names.map(n=>(
                                  <span key={n} style={{fontSize:11,background:correct?"#e8f5e2":"#f5f0fc",color:correct?"#2a6b15":"#5c3896",borderRadius:20,padding:"2px 8px",fontWeight:600}}>{n}</span>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                  {stats.total===0&&isExpanded&&(
                    <div style={{marginTop:8,fontSize:12,color:"#ccc",borderTop:"1px solid #f5f0fc",paddingTop:8}}>No predictions submitted yet</div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

                    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>

                            background:isCorrect?"#e8f5e2":isWrong?"#fde8e8":isPending?"#ede8f8":"#f5f5f5",

                          </span>

                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    );

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>

        </div>
        <div style={{marginBottom:12}}>

        }
      </div>
      <div className="card" style={{background:"#ede8f8",border:"none"}}>
        <div style={{fontSize:13,color:"#5c3896",fontWeight:600}}>Scoring: 3 points for every correct result (home win / draw / away win)</div>
      </div>
    </div>
  );
}

// ─── ADMIN ────────────────────────────────────────────────────────────────────
function AdminView({ results, saveResult, adminMode, setAdminMode, users, saveUser, deleteUser }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [activeTab, setActiveTab] = useState("results");
  const [activeGroup, setActiveGroup] = useState("A");
  const [saved, setSaved] = useState(false);
  const [search, setSearch] = useState("");
  const [editingUser, setEditingUser] = useState(null);
  const [editPreds, setEditPreds] = useState({});
  const [editGroup, setEditGroup] = useState("A");
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [subSaved, setSubSaved] = useState(false);
  const [saving, setSaving] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState("");

  const handleSync = async () => {
    setSyncing(true); setSyncMsg("");
    try {
      const res = await fetch(FUNCTION_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_KEY}`},
        body:JSON.stringify({action:"sync_results"}),
      });
      if (!res.ok) { setSyncMsg("❌ API error — please try again later."); setSyncing(false); return; }
      const data = await res.json();
      const matches = data.matches||[];
      let updated = 0;
      for (const match of matches) {
        const home=normalise(match.homeTeam?.name), away=normalise(match.awayTeam?.name);
        const homeGoals=match.score?.fullTime?.home, awayGoals=match.score?.fullTime?.away;
        if (!home||!away||homeGoals===null||awayGoals===null) continue;
        const fixture = FIXTURES.find(f=>f.home===home&&f.away===away);
        if (!fixture) continue;
        const result = homeGoals>awayGoals?"H":awayGoals>homeGoals?"A":"D";
        await saveResult(fixture.id, result);
        updated++;
      }
      setSyncMsg(`✅ Synced ${updated} result${updated!==1?"s":""} successfully.`);
    } catch(e) { setSyncMsg("❌ Network error. Please try again."); }
    setSyncing(false);
  };

  const login = async () => {
    try {
      const res = await fetch(FUNCTION_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_KEY}`},body:JSON.stringify({action:"admin_login",email:"admin",code:pw})});
      const data = await res.json();
      if(data.valid){setAdminMode(true);setErr("");}else setErr("Incorrect password.");
    } catch(e){setErr("Network error. Please try again.");}
  };

  const handleSaveResult = async (fid,val) => {
    setSaved(false); await saveResult(fid,val); setSaved(true);
    setTimeout(()=>setSaved(false),2000);
  };

  const handleEditUser = u => { setEditingUser(u.email); setEditPreds({...u.predictions}); setEditGroup("A"); };
  const handleSaveEdit = async () => {
    setSaving(true);
    const u=users.find(x=>x.email===editingUser);
    await saveUser({...u,predictions:editPreds});
    setSaving(false); setEditingUser(null); setSubSaved(true);
    setTimeout(()=>setSubSaved(false),3000);
  };
  const handleUnlock = async email => { const u=users.find(x=>x.email===email); await saveUser({...u,submitted:false}); };

  if (!adminMode) return (
    <div className="card card-accent">
      <div className="section-title">🔧 Admin Panel</div>
      <p style={{fontSize:13,color:"#666",marginBottom:14}}>Enter the admin password to manage the competition.</p>
      <input className="input" type="password" placeholder="Admin password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()}/>
      {err&&<div className="err">{err}</div>}
      <button className="btn" onClick={login}>Login →</button>
    </div>
  );

  if (editingUser) {
    const total=Object.keys(editPreds).length;
    return (
      <div>
        <div className="card card-accent" style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
            <div>
              <div className="section-title" style={{marginBottom:2}}>✏️ Editing: {users.find(u=>u.email===editingUser)?.name}</div>
              <div style={{fontSize:12,color:"#6d6e71"}}>{editingUser}</div>
            </div>
            <button className="btn" style={{background:"#888",padding:"7px 14px",fontSize:13}} onClick={()=>setEditingUser(null)}>← Back</button>
          </div>
          <div style={{marginTop:10,fontSize:13,color:"#666"}}>{total}/72 predictions set</div>
          <div className="progress-bar" style={{marginTop:6}}><div className="progress-fill" style={{width:`${(total/72)*100}%`}}/></div>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
          {Object.keys(GROUPS).map(g=>{
            const gf=FIXTURES.filter(f=>f.group===g),done=gf.filter(f=>editPreds[f.id]).length;
            return <button key={g} className={`group-tab${editGroup===g?" active":""}`} onClick={()=>setEditGroup(g)}>Group {g} {done===gf.length?"✅":`${done}/${gf.length}`}</button>;
          })}
        </div>
        <div className="card">
          <div className="section-title">Group {editGroup}</div>
          {FIXTURES.filter(f=>f.group===editGroup).map(f=>(
            <div key={f.id} className="fix-row">
              <div className="fix-label">{FLAGS[f.home]||"🏳"} {f.home} <span style={{color:"#bbb",margin:"0 6px",fontWeight:400}}>vs</span> {FLAGS[f.away]||"🏳"} {f.away}</div>
              <div className="pred-btns">
                {[["H",`${f.home} win`],["D","Draw"],["A",`${f.away} win`]].map(([c,label])=>(
                  <button key={c} className={`pred-btn${editPreds[f.id]===c?" selected":""}`} style={{fontSize:12,padding:"5px 10px"}} onClick={()=>setEditPreds(p=>({...p,[f.id]:c}))}>{label}</button>
                ))}
                {editPreds[f.id]&&<button className="pred-btn" style={{color:"#c00",borderColor:"#f5c0c0",fontSize:11}} onClick={()=>setEditPreds(p=>{const n={...p};delete n[f.id];return n;})}>✕ Clear</button>}
              </div>
            </div>
          ))}
        </div>
        <div style={{marginTop:14,display:"flex",gap:10,alignItems:"center"}}>
          <button className="btn btn-green" onClick={handleSaveEdit} disabled={saving}>{saving?"Saving...":"💾 Save Changes"}</button>
          <button className="btn" style={{background:"#888"}} onClick={()=>setEditingUser(null)}>Cancel</button>
        </div>
      </div>
    );
  }

  const participantList=users.filter(u=>!search||u.name?.toLowerCase().includes(search.toLowerCase())||u.email?.toLowerCase().includes(search.toLowerCase()));

  return (
    <div>
      <div className="card" style={{marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div className="section-title" style={{marginBottom:0}}>🔧 Admin Panel</div>
          <div className="pill">{users.length} staff entered</div>
        </div>
        <div className="tabs">
          {[["results","⚽ Match Results"],["submissions","👥 Manage Submissions"]].map(([t,label])=>(
            <button key={t} className={`group-tab${activeTab===t?" active":""}`} style={{fontSize:13,padding:"7px 16px"}} onClick={()=>setActiveTab(t)}>{label}</button>
          ))}
        </div>
      </div>

      {activeTab==="results"&&(
        <>
          <div className="card" style={{marginBottom:12}}>
            <p style={{fontSize:13,color:"#666",marginBottom:10}}>Click a result to save it manually, or use Sync to pull the latest finished results automatically.</p>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
              <button className="btn btn-green" style={{fontSize:13,padding:"8px 16px"}} onClick={handleSync} disabled={syncing}>{syncing?"⏳ Syncing...":"🔄 Sync Results"}</button>
              {syncMsg&&<span style={{fontSize:12,color:syncMsg.startsWith("✅")?"#4e9d2d":"#c0392b",fontWeight:600}}>{syncMsg}</span>}
            </div>
            {saved&&<div className="ok" style={{marginTop:8}}>✅ Result saved!</div>}
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
            {Object.keys(GROUPS).map(g=>{
              const done=FIXTURES.filter(f=>f.group===g&&results[f.id]).length,tot=FIXTURES.filter(f=>f.group===g).length;
              return <button key={g} className={`group-tab${activeGroup===g?" active":""}`} onClick={()=>setActiveGroup(g)}>Group {g} {done>0?`${done}/${tot}`:""}</button>;
            })}
          </div>
          <div className="card">
            <div className="section-title">Group {activeGroup} Results</div>
            {FIXTURES.filter(f=>f.group===activeGroup).map(f=>(
              <div key={f.id} className="fix-row">
                <div className="fix-label">{FLAGS[f.home]||"🏳"} {f.home} <span style={{color:"#bbb",margin:"0 6px",fontWeight:400}}>vs</span> {FLAGS[f.away]||"🏳"} {f.away}</div>
                <div className="pred-btns">
                  {[["H",`${f.home} win`],["D","Draw"],["A",`${f.away} win`]].map(([c,label])=>(
                    <button key={c} className={`pred-btn${results[f.id]===c?" selected":""}`} style={{fontSize:12,padding:"5px 10px"}} onClick={()=>handleSaveResult(f.id,c)}>{label}</button>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      {activeTab==="submissions"&&(
        <>
          <div className="card" style={{marginBottom:12}}>
            <p style={{fontSize:13,color:"#666",marginBottom:10}}>Edit, unlock or delete participant submissions.</p>
            <input className="input" style={{marginBottom:0}} placeholder="🔍 Search by name or email..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          {subSaved&&<div className="alert alert-green" style={{marginBottom:12}}>✅ Submission updated.</div>}
          {participantList.length===0
            ? <div className="card" style={{textAlign:"center",color:"#aaa",fontSize:14}}>No participants found.</div>
            : participantList.map(u=>(
              <div key={u.email} className="card" style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:700}}>{u.name||"—"}</div>
                    <div style={{fontSize:12,color:"#6d6e71"}}>{u.email}</div>
                    <div style={{fontSize:11,color:"#bbb",marginTop:2}}>
                      {u.department||"—"} · {Object.keys(u.predictions||{}).length}/72 predictions
                      {" · "}<span style={{color:u.submitted?"#4e9d2d":"#f36d21",fontWeight:700}}>{u.submitted?"🔒 Locked":"🔓 Unlocked"}</span>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    <button className="btn" style={{padding:"6px 12px",fontSize:12}} onClick={()=>handleEditUser(u)}>✏️ Edit</button>
                    <button className="btn btn-orange" style={{padding:"6px 12px",fontSize:12}} onClick={()=>handleUnlock(u.email)}>🔓 Unlock</button>
                    <button className="btn btn-red" style={{padding:"6px 12px",fontSize:12}} onClick={()=>setConfirmDelete(u.email)}>🗑 Delete</button>
                  </div>
                </div>
                {confirmDelete===u.email&&(
                  <div className="alert alert-orange" style={{marginTop:10}}>
                    <div style={{fontWeight:700,marginBottom:6}}>⚠️ Delete {u.name}'s submission? This cannot be undone.</div>
                    <div style={{display:"flex",gap:8}}>
                      <button className="btn btn-red" style={{padding:"6px 14px",fontSize:12}} onClick={()=>{deleteUser(u.email);setConfirmDelete(null);}}>Yes, delete</button>
                      <button className="btn" style={{background:"#888",padding:"6px 14px",fontSize:12}} onClick={()=>setConfirmDelete(null)}>Cancel</button>
                    </div>
                  </div>
                )}
              </div>
            ))
          }
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
